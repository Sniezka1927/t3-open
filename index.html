<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Open in T3 Code</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 32rem; margin: 20vh auto; padding: 0 16px; }
  a { color: inherit; }
  label { display: block; margin-top: 2rem; opacity: 0.75; font-size: 13px; }
</style>
</head>
<body>
<p id="status">Opening the thread in T3 Code…</p>
<p><a id="link" hidden>Open again</a></p>
<label id="auto" hidden><input type="checkbox" id="autoclose"> Close this tab once T3 Code opens. Turn on after you chose "Always allow" for T3 Code, or it closes the browser's prompt too.</label>
<script>
(function () {
  // Top-level names would clash with `window.status` and `window.close`, so all of it is in this function.
  // Only `#threads/<environmentId>/<threadId>` is opened, and only in T3 Code.
  var target = location.hash.slice(1);
  var message = document.getElementById("status");
  var key = "autoclose";
  var read = function () { try { return localStorage.getItem(key) === "1"; } catch (e) { return false; } };
  var write = function (on) { try { on ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {} };

  if (/^threads\/[A-Za-z0-9%._~-]+\/[A-Za-z0-9%._~-]+$/.test(target)) {
    var app = "t3code://" + target;
    var link = document.getElementById("link");
    var box = document.getElementById("autoclose");
    link.href = app;
    link.hidden = false;
    box.checked = read();
    box.onchange = function () { write(box.checked); };
    document.getElementById("auto").hidden = false;
    // Browsers let a page close a tab with one history entry, which a tab opened from a Discord link is.
    // A tab that opened in the background never had focus, so it never blurs: the timer closes it too.
    var closeTab = function () {
      if (!read()) return;
      window.close();
      setTimeout(function () { message.textContent = "The browser did not let this page close the tab. You can close it."; }, 300);
    };
    window.addEventListener("blur", closeTab);
    document.addEventListener("visibilitychange", function () { if (document.hidden) closeTab(); });
    location.replace(app);
    setTimeout(function () {
      message.textContent = "Opened in T3 Code. You can close this tab.";
      closeTab();
    }, 1500);
  } else {
    message.textContent = "This link has no T3 thread.";
  }
})();
</script>
</body>
</html>
